<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>מקדש היהלומים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #fdf8e8;
    --shadow: rgba(10, 25, 10, .75);
    --panel: rgba(20, 40, 22, .62);
    --diamond: #7fe9ff;
    --p1: #ff6b5a;
    --p2: #5ab4ff;
    --gold: #f2c94c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #a9c9a4; }
  body { font-family: 'Rubik', 'Segoe UI', Arial, sans-serif; color: var(--ink); user-select: none; }
  canvas { display: block; }
  #divider { position: fixed; top: 0; bottom: 0; left: 50%; width: 4px; margin-left: -2px; background: linear-gradient(#3b2a14, #6b4c22, #3b2a14); box-shadow: 0 0 8px #000a; pointer-events: none; }
  .phud { position: fixed; top: 12px; padding: 8px 14px; background: var(--panel); border-radius: 12px; text-shadow: 0 2px 3px var(--shadow); min-width: 170px; pointer-events: none; }
  .phud .name { font-weight: 900; font-size: 18px; }
  .phud .hearts { font-size: 22px; letter-spacing: 2px; direction: ltr; text-align: right; }
  .phud .note { font-size: 14px; color: var(--gold); min-height: 18px; }
  #p1hud { left: 12px; border-bottom: 3px solid var(--p1); }
  #p2hud { right: 12px; border-bottom: 3px solid var(--p2); }
  #p1hud .name { color: var(--p1); }
  #p2hud .name { color: var(--p2); }
  #center { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); text-align: center; background: var(--panel); padding: 6px 18px; border-radius: 12px; text-shadow: 0 2px 3px var(--shadow); pointer-events: none; }
  #levelName { font-weight: 700; font-size: 16px; }
  #gems { font-size: 20px; color: var(--diamond); font-weight: 900; }
  #bossbar { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); width: min(560px, 80vw); text-align: center; display: none; pointer-events: none; }
  #bossname { font-weight: 900; font-size: 20px; text-shadow: 0 2px 4px #000; margin-bottom: 4px; }
  #bossbar .bar { height: 18px; border-radius: 9px; background: #000a; border: 2px solid #c9b27a; overflow: hidden; }
  #bossfill { height: 100%; width: 100%; background: linear-gradient(90deg, #4fd8ff, #b6f6ff); transition: width .15s; }
  #msg { position: fixed; top: 34%; left: 50%; transform: translateX(-50%); font-size: 26px; font-weight: 900; text-align: center; text-shadow: 0 3px 6px #000; pointer-events: none; opacity: 0; transition: opacity .3s; white-space: nowrap; }
  #banner { position: fixed; top: 20%; left: 50%; transform: translateX(-50%); font-size: 44px; font-weight: 900; color: var(--gold); text-align: center; text-shadow: 0 4px 10px #000; pointer-events: none; opacity: 0; transition: opacity .6s; white-space: nowrap; }
  #banner small { display: block; font-size: 22px; color: var(--ink); font-weight: 700; }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse at center, rgba(15,35,18,.55), rgba(5,15,8,.88)); }
  #overlay.hidden { display: none; }
  .card { max-width: 760px; width: calc(100% - 32px); text-align: center; padding: 26px 30px; border-radius: 22px; background: rgba(30, 48, 30, .78); border: 2px solid #8a7a4a; box-shadow: 0 10px 40px #000a; }
  .card h1 { margin: 0 0 4px; font-size: 52px; font-weight: 900; color: var(--gold); text-shadow: 0 4px 0 #6b4c22, 0 8px 18px #000; }
  .card h1 .gem { color: var(--diamond); }
  .card h2 { margin: 0 0 16px; font-weight: 700; font-size: 20px; color: #d8e8c8; }
  .controls { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin: 14px 0; }
  .ctl { flex: 1 1 260px; padding: 12px 14px; border-radius: 14px; background: #0005; text-align: right; }
  .ctl h3 { margin: 0 0 8px; font-size: 20px; }
  .ctl.p1 h3 { color: var(--p1); }
  .ctl.p2 h3 { color: var(--p2); }
  .ctl div { margin: 5px 0; font-size: 16px; }
  kbd { display: inline-block; min-width: 26px; padding: 2px 7px; margin: 0 2px; border-radius: 6px; background: #f3ead2; color: #2b2112; font-family: inherit; font-weight: 700; font-size: 14px; box-shadow: 0 2px 0 #8a7a4a; direction: ltr; }
  .tips { font-size: 15px; color: #d8e8c8; line-height: 1.6; margin: 8px 0 14px; }
  .start { font-size: 22px; font-weight: 900; color: #fff; animation: pulse 1.4s infinite; }
  .levels { margin-top: 10px; font-size: 15px; color: #cfe0bd; }
  @keyframes pulse { 50% { opacity: .45; } }
  @media (max-width: 700px) { .card h1 { font-size: 36px; } #banner { font-size: 28px; } .phud { min-width: 0; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="divider"></div>
<div id="p1hud" class="phud"><div class="name">שחקן 1</div><div class="hearts"></div><div class="note"></div></div>
<div id="p2hud" class="phud"><div class="name">שחקן 2</div><div class="hearts"></div><div class="note"></div></div>
<div id="center"><div id="levelName"></div><div id="gems">💎 0</div></div>
<div id="bossbar"><div id="bossname"></div><div class="bar"><div id="bossfill"></div></div></div>
<div id="msg"></div>
<div id="banner"></div>
<div id="overlay"><div class="card" id="card"></div></div>

<script src="three.min.js"></script>
<script>if (!window.THREE) document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>');</script>
<script>
'use strict';
// =====================================================================
//  מקדש היהלומים — משחק פארקור ובוסים תלת־ממדי לשני שחקנים
// =====================================================================
const V3 = THREE.Vector3;
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const approach = (v, t, d) => v < t ? Math.min(v + d, t) : Math.max(v - d, t);
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let rnd = mulberry32(7);

// ---------------------------------------------------------------- renderer
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
renderer.setSize(innerWidth, innerHeight);
const scene = new THREE.Scene();
const SKY = 0xa9c9a4;
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, 30, 115);
const hemi = new THREE.HemisphereLight(0xf2ffe2, 0x2b3d1f, 0.9);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1c8, 0.75);
sun.position.set(6, 12, 5);
scene.add(sun);
const cams = [new THREE.PerspectiveCamera(62, 1, 0.1, 220), new THREE.PerspectiveCamera(62, 1, 0.1, 220)];
let levelGroup = new THREE.Group();
scene.add(levelGroup);
let fxGroup = new THREE.Group();
scene.add(fxGroup);
addEventListener('resize', () => renderer.setSize(innerWidth, innerHeight));
const SKIES = {
  day: { bg: 0xa9c9a4, near: 30, far: 115, hemi: .9, hsky: 0xf2ffe2, sun: .75, sunc: 0xfff1c8 },
  mist: { bg: 0xc9dbd0, near: 16, far: 78, hemi: 1, hsky: 0xf4fff8, sun: .5, sunc: 0xffffff },
  sunset: { bg: 0xe2a36f, near: 28, far: 105, hemi: .75, hsky: 0xffd9b0, sun: .95, sunc: 0xffb070 },
  night: { bg: 0x16263a, near: 20, far: 90, hemi: .5, hsky: 0x8fa4d8, sun: .45, sunc: 0xa8c0ff },
  cave: { bg: 0x1d2a22, near: 14, far: 70, hemi: .6, hsky: 0xb0d8c0, sun: .35, sunc: 0x9ff4ff },
  blood: { bg: 0xb4584a, near: 25, far: 100, hemi: .75, hsky: 0xffc0a0, sun: .95, sunc: 0xff8a60 },
};
function applySky(name) {
  const k = SKIES[name] || SKIES.day;
  scene.background.setHex(k.bg); scene.fog.color.setHex(k.bg); scene.fog.near = k.near; scene.fog.far = k.far;
  hemi.intensity = k.hemi; hemi.color.setHex(k.hsky); sun.intensity = k.sun; sun.color.setHex(k.sunc);
  document.body.style.background = '#' + k.bg.toString(16).padStart(6, '0');
}

// ---------------------------------------------------------------- textures & materials
function canvasTex(size, paint) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  paint(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}
const r0 = mulberry32(99);
const stoneTex = canvasTex(64, (x, s) => {
  for (let i = 0; i < s; i += 4) for (let j = 0; j < s; j += 4) {
    const v = 190 + r0() * 55 | 0; x.fillStyle = `rgb(${v},${v},${v - 6})`; x.fillRect(i, j, 4, 4);
  }
  x.strokeStyle = 'rgba(60,60,50,.55)'; x.lineWidth = 1.5;
  for (let k = 0; k < 5; k++) { x.beginPath(); let px = r0() * s, py = r0() * s; x.moveTo(px, py); for (let q = 0; q < 4; q++) { px += (r0() - .5) * 20; py += (r0() - .5) * 20; x.lineTo(px, py); } x.stroke(); }
  for (let k = 0; k < 40; k++) { x.fillStyle = `rgba(70,${120 + r0() * 60 | 0},50,.6)`; x.fillRect(r0() * s, r0() * s, 3, 3); }
});
const woodTex = canvasTex(64, (x, s) => {
  for (let j = 0; j < s; j++) { const v = 170 + Math.sin(j * .9) * 25 + r0() * 30 | 0; x.fillStyle = `rgb(${v},${v * .8 | 0},${v * .6 | 0})`; x.fillRect(0, j, s, 1); }
  x.fillStyle = 'rgba(40,25,10,.6)'; for (let k = 0; k < 4; k++) x.fillRect(0, k * 16, s, 2);
});
const glowTex = canvasTex(64, (x, s) => {
  const g = x.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(.35, 'rgba(255,255,255,.45)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, s, s);
});
const lam = (color, map) => new THREE.MeshLambertMaterial({ color, map: map || null });
const M = {
  stone: lam(0xa3a88f, stoneTex), stoneDark: lam(0x737a66, stoneTex), moss: lam(0x3f7a28), wood: lam(0x9a6634, woodTex),
  crumble: lam(0xc0a274, stoneTex), move: lam(0xd2b072, stoneTex), trunk: lam(0x5a3d22, woodTex),
  leaf: [lam(0x2f7d32), lam(0x3e8e2f), lam(0x256b2a), lam(0x4c9a3a), lam(0x5aa83c)], vine: lam(0x2e6b26),
  ground: lam(0x2c4a25), skin: lam(0xf1c27d), hat: lam(0xc8a165), hatBand: lam(0x5a3d22), hilt: lam(0x6b4423),
  p1: lam(0xe74c3c), p2: lam(0x3498db), p1d: lam(0x8e2a1f), p2d: lam(0x1f4f7b), pants: lam(0x5b4a33),
  black: new THREE.MeshBasicMaterial({ color: 0x151515 }),
  vanish: new THREE.MeshPhongMaterial({ color: 0x7fe3ff, transparent: true, opacity: .72, shininess: 90, emissive: 0x1a5a70 }),
  gold: new THREE.MeshPhongMaterial({ color: 0xe8b830, emissive: 0x3a2800, shininess: 80 }),
  shroom: lam(0xd83a2e), shroomSpot: lam(0xfff4e0), stem: lam(0xefe2c4),
  fall: new THREE.MeshBasicMaterial({ color: 0xbfeaff, transparent: true, opacity: .55, depthWrite: false }),
  water: new THREE.MeshPhongMaterial({ color: 0x2f7466, transparent: true, opacity: .9, shininess: 60 }),
  blade: new THREE.MeshPhongMaterial({ color: 0xe6edf5, shininess: 140, specular: 0xffffff }),
  laser: new THREE.MeshBasicMaterial({ color: 0xff3030, transparent: true, opacity: .9 }),
  wave: new THREE.MeshBasicMaterial({ color: 0xffb04a, transparent: true, opacity: .6, side: THREE.DoubleSide, depthWrite: false }),
  marker: new THREE.MeshBasicMaterial({ color: 0xff2a2a, transparent: true, opacity: .45, depthWrite: false }),
  shadow: new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: .35, depthWrite: false }),
  cpOn: new THREE.MeshPhongMaterial({ color: 0x8dff9c, emissive: 0x2a9a3a, flatShading: true }),
  barrier: new THREE.MeshBasicMaterial({ color: 0x7fe9ff, transparent: true, opacity: .22, depthWrite: false }),
  portal: new THREE.MeshBasicMaterial({ color: 0x9ff4ff, transparent: true, opacity: .55, side: THREE.DoubleSide }),
};
const diamondMat = new THREE.MeshPhongMaterial({ color: 0x8ff6ff, emissive: 0x2aa8d8, specular: 0xffffff, shininess: 160, flatShading: true });
const redEyeMat = new THREE.MeshPhongMaterial({ color: 0xff7070, emissive: 0xd01010, specular: 0xffffff, shininess: 160, flatShading: true });
const gemMat = new THREE.MeshPhongMaterial({ color: 0x9ff8ff, emissive: 0x2a9ad0, specular: 0xffffff, shininess: 200, flatShading: true, transparent: true, opacity: .92 });
const glowMat = c => new THREE.SpriteMaterial({ map: glowTex, color: c, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true });
const cyanGlow = glowMat(0x55e6ff), redGlow = glowMat(0xff3a3a), goldGlow = glowMat(0xffd76a);

const GEO = {
  box: new THREE.BoxGeometry(1, 1, 1), octa: new THREE.OctahedronGeometry(1, 0), cyl: new THREE.CylinderGeometry(1, 1, 1, 12),
  trunk: new THREE.CylinderGeometry(.7, 1, 1, 7), ico: new THREE.IcosahedronGeometry(1, 0), sph: new THREE.SphereGeometry(1, 14, 10),
  dome: new THREE.SphereGeometry(1, 16, 8, 0, Math.PI * 2, 0, Math.PI / 2),
  cone: new THREE.ConeGeometry(1, 1, 6), wave: new THREE.CylinderGeometry(1, 1, .7, 48, 1, true), circle: new THREE.CircleGeometry(1, 24),
  torus: new THREE.TorusGeometry(1.7, .22, 10, 40), ring: new THREE.RingGeometry(.75, 1, 32),
};
function mk(geo, mat, sx, sy, sz, x, y, z, parent) {
  const m = new THREE.Mesh(geo, mat); m.scale.set(sx, sy, sz); m.position.set(x, y, z);
  (parent || levelGroup).add(m); return m;
}
const boxM = (mat, w, h, d, x, y, z, p) => mk(GEO.box, mat, w, h, d, x, y, z, p);

// ---------------------------------------------------------------- audio
let AC = null;
function initAudio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } } if (AC && AC.state === 'suspended') AC.resume(); }
function tone(f1, f2, dur, type, vol, delay) {
  if (!AC) return;
  const t0 = AC.currentTime + (delay || 0), o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t0); o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0 + dur + .02);
}
const SFX = {
  jump: () => tone(380, 720, .13, 'square', .05), djump: () => tone(560, 1000, .13, 'square', .05),
  gem: () => { tone(1320, 1760, .09, 'sine', .08); tone(1760, 2400, .12, 'sine', .06, .06); },
  hurt: () => tone(260, 70, .3, 'sawtooth', .09), swing: () => tone(900, 300, .09, 'triangle', .04),
  hit: () => { tone(180, 60, .18, 'square', .1); tone(900, 400, .1, 'triangle', .06); }, clink: () => tone(2200, 1800, .08, 'triangle', .06),
  slam: () => tone(90, 30, .5, 'sine', .3), bounce: () => tone(220, 880, .22, 'sine', .1), shoot: () => tone(1400, 700, .12, 'sine', .04),
  cp: () => [523, 659, 784].forEach((f, i) => tone(f, f, .16, 'sine', .08, i * .09)),
  win: () => [523, 659, 784, 1046, 1318].forEach((f, i) => tone(f, f * 1.01, .25, 'triangle', .09, i * .13)),
  down: () => tone(400, 50, .7, 'sawtooth', .08),
};

// ---------------------------------------------------------------- input
const keys = new Set(), pressed = new Set();
const GAME_KEYS = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Enter', 'NumpadEnter', 'ShiftRight', 'Slash', 'Backslash', 'Period']);
addEventListener('keydown', e => {
  initAudio();
  if (GAME_KEYS.has(e.code)) e.preventDefault();
  if (!keys.has(e.code)) pressed.add(e.code);
  keys.add(e.code);
});
addEventListener('keyup', e => keys.delete(e.code));
addEventListener('blur', () => keys.clear());
const CONTROLS = [
  { up: ['KeyW'], down: ['KeyS'], left: ['KeyA'], right: ['KeyD'], jump: ['Space'], attack: ['KeyF'] },
  { up: ['ArrowUp'], down: ['ArrowDown'], left: ['ArrowLeft'], right: ['ArrowRight'], jump: ['Enter', 'NumpadEnter', 'Numpad0'], attack: ['ShiftRight', 'Backslash', 'Slash', 'KeyL', 'Period'] },
];
const held = list => list.some(k => keys.has(k));
const tapped = list => list.some(k => pressed.has(k));

// ---------------------------------------------------------------- HUD
const $ = id => document.getElementById(id);
const hud = {
  p: [$('p1hud'), $('p2hud')], gems: $('gems'), level: $('levelName'), bossbar: $('bossbar'), bossname: $('bossname'), bossfill: $('bossfill'),
  msg: $('msg'), banner: $('banner'), overlay: $('overlay'), card: $('card'),
};
let msgTimer = 0, bannerTimer = 0;
function say(text, dur) { hud.msg.textContent = text; hud.msg.style.opacity = 1; msgTimer = dur || 2; }
function banner(html, dur) { hud.banner.innerHTML = html; hud.banner.style.opacity = 1; bannerTimer = dur || 3; }

// ---------------------------------------------------------------- statues with diamond eyes
function makeStatue(s, opts) {
  opts = opts || {};
  const g = new THREE.Group();
  const st = opts.mat || M.stone, dk = M.stoneDark;
  boxM(dk, 1.7, .4, 1.3, 0, .2, 0, g);
  boxM(st, 1.3, 1.5, .9, 0, 1.15, 0, g);
  const armL = boxM(st, .36, 1.25, .5, -.86, 1.25, .05, g), armR = boxM(st, .36, 1.25, .5, .86, 1.25, .05, g);
  const head = new THREE.Group(); head.position.set(0, 2.45, 0); g.add(head);
  boxM(st, 1.2, 1.1, 1.0, 0, 0, 0, head);
  boxM(dk, 1.3, .2, .25, 0, .28, .5, head);
  boxM(dk, .22, .42, .22, 0, -.08, .56, head);
  boxM(M.black, .62, .1, .08, 0, -.36, .51, head);
  boxM(dk, 1.45, .36, 1.12, 0, .7, 0, head);
  const top = boxM(st, .55, .55, .55, 0, 1.05, 0, head); top.rotation.set(Math.PI / 4, 0, Math.PI / 4);
  if (opts.crown) {
    boxM(M.gold, 1.55, .3, 1.25, 0, .98, 0, head);
    for (let i = -2; i <= 2; i++) mk(GEO.cone, M.gold, .16, .55, .16, i * .32, 1.35, .5, head);
    mk(GEO.octa, diamondMat, .2, .28, .2, 0, 1.45, .64, head);
  }
  const eyeMat = opts.eyeMat || diamondMat;
  const eyes = [], glows = [];
  for (const sx of [-1, 1]) {
    const e = mk(GEO.octa, eyeMat, .18, .24, .14, sx * .28, .12, .52, head); eyes.push(e);
    const gl = new THREE.Sprite(opts.glowMat || cyanGlow); gl.position.set(sx * .28, .12, .62); gl.scale.setScalar(.8); head.add(gl); glows.push(gl);
  }
  if (!opts.clean) for (let i = 0; i < 4; i++) boxM(M.moss, .3 + rnd() * .3, .1, .3 + rnd() * .3, (rnd() - .5) * 1.2, 1.92, (rnd() - .5) * .7, g);
  g.scale.setScalar(s);
  return { group: g, head, eyes, glows, armL, armR };
}
function setEyes(st, red, glowScale) {
  for (const e of st.eyes) e.material = red ? (st.redEye || redEyeMat) : (st.cyanEye || diamondMat);
  for (const g of st.glows) { g.material = red ? redGlow : cyanGlow; g.scale.setScalar(glowScale || .8); }
}

// ---------------------------------------------------------------- players
class Player {
  constructor(idx) {
    this.idx = idx; this.ctl = CONTROLS[idx];
    this.pos = new V3(); this.vel = new V3(); this.kb = new V3();
    this.face = Math.PI; this.hearts = 5; this.maxHearts = 5;
    this.onGround = false; this.ground = null; this.jumps = 0; this.coyote = 0;
    this.inv = 0; this.dead = false; this.respawn = 0; this.attackT = 0; this.attackCd = 0; this.walk = 0;
    this.lastSafe = new V3();
    const g = new THREE.Group(); this.group = g; scene.add(g);
    const body = idx ? M.p2 : M.p1, dark = idx ? M.p2d : M.p1d;
    this.model = new THREE.Group(); g.add(this.model);
    const m = this.model;
    this.legs = [];
    for (const sx of [-1, 1]) {
      const hip = new THREE.Group(); hip.position.set(sx * .17, .55, 0); m.add(hip);
      boxM(M.pants, .24, .5, .26, 0, -.25, 0, hip); boxM(M.hatBand, .26, .12, .32, 0, -.5, .03, hip);
      this.legs.push(hip);
    }
    boxM(body, .72, .78, .44, 0, .95, 0, m);
    boxM(dark, .74, .12, .46, 0, .6, 0, m);
    boxM(M.hatBand, .1, .8, .46, .2, .97, 0, m).rotation.z = .6;
    const head = new THREE.Group(); head.position.set(0, 1.62, 0); m.add(head);

// ---------------------------------------------------------------- level builder
function Builder() {

  function collider(mesh, x, top, z, w, h, d, extra) {
    const c = Object.assign({ mesh, cx: x, cy: top - h / 2, cz: z, hw: w / 2, hh: h / 2, hd: d / 2, min: new V3(), max: new V3(), active: true, dx: 0, dy: 0, dz: 0, safe: true }, extra || {});
    c.update = () => { c.min.set(c.cx - c.hw, c.cy - c.hh, c.cz - c.hd); c.max.set(c.cx + c.hw, c.cy + c.hh, c.cz + c.hd); };
    c.update(); plats.push(c); return c;
  }
  function platMesh(mat, x, top, z, w, h, d, cap) {
    const g = new THREE.Group(); g.position.set(x, top - h / 2, z); levelGroup.add(g);
    boxM(mat, w, h, d, 0, 0, 0, g);
    if (cap) boxM(M.moss, w + .06, .14, d + .06, 0, h / 2 - .02, 0, g);
    return g;
  }
  const B = {
    plats, hazards, gems, cps, movers,
    get arenaData() { return arena; },
    box(x, top, z, w, h, d, mat) {
      const g = platMesh(mat || M.stone, x, top, z, w, h, d, true);
      if (w * d > 20 && rnd() < .7) for (let i = 0; i < 2; i++) {
        const bx = x + (rnd() > .5 ? 1 : -1) * (w / 2 - .5), bz = z + (rnd() - .5) * (d - 1);
        mk(GEO.ico, M.leaf[i % 5], .5, .4, .5, bx, top + .25, bz);
      }

    },
    move(x, top, z, w, d, ax, range, speed, phase) {
      const g = platMesh(M.move, x, top, z, w, .7, d, false);
      boxM(M.gold, w + .08, .1, d + .08, 0, .3, 0, g);
      const c = collider(g, x, top, z, w, .7, d, { safe: false });
      const bx = x, by = top - .35, bz = z;
      c.tick = t => {
        const o = Math.sin(t * speed + (phase || 0)) * range;
        const nx = bx + (ax === 'x' ? o : 0), ny = by + (ax === 'y' ? o : 0), nz = bz + (ax === 'z' ? o : 0);
        c.dx = nx - c.cx; c.dy = ny - c.cy; c.dz = nz - c.cz; c.cx = nx; c.cy = ny; c.cz = nz;

    },
    crumble(x, top, z, w, d) {

        else if (c.state === 'fall') { g.position.y -= dt * 9; g.visible = g.position.y > top - 14; if (c.timer <= 0) { c.state = 'idle'; c.active = true; g.visible = true; g.position.set(x, top - .3, z); } }
      };

    },
    vanish(x, top, z, w, d, period, off) {

    spinner(x, top, z, len, speed) {

      const log = mk(GEO.cyl, M.trunk, .3, len, .3, 0, 0, 0, piv); log.rotation.z = Math.PI / 2;
      mk(GEO.cyl, M.stoneDark, .35, .9, .35, x, top + .1, z);

      hazards.push({
        type: 'spinner', update(t) { piv.rotation.y = t * speed; },
        test(pl) {

          const a = piv.rotation.y, dx = Math.cos(a), dz = -Math.sin(a);

    },
    laser(x, top, z, len, period, off) {

        const sx = x + s * (len / 2 + 1);

        const st = makeStatue(.85, {}); st.group.position.set(sx, top - 1.6, z); st.group.rotation.y = -s * Math.PI / 2; levelGroup.add(st.group); sts.push(st);
      }
      const beam = mk(GEO.box, M.laser.clone(), len + 1.2, .1, .1, x, top + .55, z);

          beam.material.opacity = st === 2 ? .92 : .25 + Math.sin(t * 30) * .1;
          beam.scale.y = beam.scale.z = st === 2 ? .2 : .05;
        },
        test(pl) { return this.on && Math.abs(pl.pos.z - z) < .45 && Math.abs(pl.pos.x - x) < len / 2 + .3 && pl.pos.y < top + .85; },
      });
    },
    mushroom(x, top, z, r) {
      const g = new THREE.Group(); g.position.set(x, top, z); levelGroup.add(g);
      mk(GEO.cyl, M.stem, r * .32, 15, r * .32, 0, -7.6, 0, g);
      const cap = mk(GEO.dome, M.shroom, r, r * .55, r, 0, -r * .55, 0, g);
      mk(GEO.circle, M.stem, r, r, 1, 0, -r * .55, 0, g).rotation.x = Math.PI / 2;
      for (let i = 0; i < 6; i++) { const a = i / 6 * TAU; mk(GEO.sph, M.shroomSpot, .12, .06, .12, Math.cos(a) * .55, .84, Math.sin(a) * .55, cap); }
      mk(GEO.sph, M.shroomSpot, .14, .07, .14, 0, 1, 0, cap);

      };
      c.tick = (t, dt) => { c.squash = Math.max(0, c.squash - dt); cap.scale.set(r * (1 + c.squash * .8), r * .55 * (1 - c.squash * 1.5), r * (1 + c.squash * .8)); };
      movers.push(c); return c;
    },
    boulder(x, top, z1, z2, period, off) {

      hazards.push({
        type: 'boulder', src: new V3(x, top, z1), r: 0,
        update(t) {
          const ph = ((t + (off || 0)) % period) / period, z = lerp(z1, z2, ph);

function decorate(B, zEnd) {
  // jungle floor, river, trees, vines, side statues and fireflies
  const len = 40 - zEnd, mid = (40 + zEnd) / 2;
  mk(GEO.box, M.ground, 140, 1, len + 60, 0, -14.5, mid);
  mk(GEO.box, M.water, 14, .2, len + 60, 0, -13.9, mid);
  for (let z = 30; z > zEnd - 30; z -= 3.2) {
    for (const side of [-1, 1]) {
      if (rnd() < .2) continue;
      let x = side * (9 + rnd() * 20);
      const inArena = Math.abs(z - B.arenaData.c.z) < 19;
      if (inArena && Math.abs(x) < 19) x = side * (19 + rnd() * 10);
      const h = 18 + rnd() * 14;
      mk(GEO.trunk, M.trunk, .7 + rnd() * .4, h, .7 + rnd() * .4, x, -14 + h / 2, z);
      const top = -14 + h;
      for (let k = 0; k < 3; k++) {
        const s = 2.5 + rnd() * 2.5;
        mk(GEO.ico, M.leaf[(rnd() * 5) | 0], s, s * .7, s, x + (rnd() - .5) * 3, top + (rnd() - .3) * 2, z + (rnd() - .5) * 3);
      }
      for (let k = 0; k < 2; k++) { const vl = 5 + rnd() * 9; mk(GEO.cyl, M.vine, .05, vl, .05, x + (rnd() - .5) * 4, top - vl / 2, z + (rnd() - .5) * 4); }
    }
  }
  for (let z = -8; z > zEnd + 22; z -= 19) {
    for (const side of [-1, 1]) {
      if (z < B.arenaData.c.z + 19) continue;
      B.pillarStatue(side * 8.5, z + side * 4, 1 + rnd() * 3, 1.3, side < 0 ? Math.PI / 2 : -Math.PI / 2);
    }
  }
  const n = 260, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { pos[i * 3] = (rnd() - .5) * 40; pos[i * 3 + 1] = -8 + rnd() * 18; pos[i * 3 + 2] = 30 - rnd() * (len + 40); }
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const pts = new THREE.Points(geo, new THREE.PointsMaterial({ color: 0xfff6a0, size: .18, transparent: true, opacity: .85, blending: THREE.AdditiveBlending, depthWrite: false }));
  levelGroup.add(pts); return pts;
}

// ---------------------------------------------------------------- game
const G = {
  state: 'menu', level: 0, t: 0, gems: 0, levelGems: 0, shake: 0, killY: -10,
  players: [], plats: [], hazards: [], gemList: [], cps: [], movers: [], arena: null, boss: null,
  waves: [], shards: [], portal: null, cp: new V3(), fireflies: null, hintClink: false,

  cpPos(i) { return this.cp.clone().add(new V3(i ? 1 : -1, .2, 0)); },

  clearLevel() {
    scene.remove(levelGroup); scene.remove(fxGroup);
    if (this.fireflies) this.fireflies.geometry.dispose();
    levelGroup = new THREE.Group(); fxGroup = new THREE.Group(); scene.add(levelGroup); scene.add(fxGroup);
    particles.length = 0; this.waves = []; this.shards = []; this.boss = null; this.portal = null;
  },

  loadLevel(i) {
    this.clearLevel(); rnd = mulberry32(1000 + i * 77);
    this.level = i; this.t = 0; this.levelGems = 0;
    const B = Builder(); LEVELS[i].build(B);
    this.fireflies = decorate(B, B.arenaData.c.z - 20);
    rnd = mulberry32(Date.now() & 0xffff);
    Object.assign(this, { plats: B.plats, hazards: B.hazards, gemList: B.gems, cps: B.cps, movers: B.movers, arena: B.arenaData });
    this.cp.set(0, 0, 2);
    this.killY = Math.min(...this.plats.map(p => p.min.y)) - 6;
    this.players.forEach((p, k) => { p.dead = false; p.hearts = p.maxHearts; p.group.visible = true; p.shadow.visible = true; p.spawnAt(this.cpPos(k)); p.face = Math.PI; p.inv = 0; });
    hud.level.textContent = `שלב ${i + 1}/${LEVELS.length}: ${LEVELS[i].name}`;
    applySky(LEVELS[i].sky);
    hud.bossbar.style.display = 'none';
    banner(`שלב ${i + 1}: ${LEVELS[i].name}<small>${LEVELS[i].sub}</small>`, 3.5);
    this.snapCams();
    this.updateHud(true);
  },

  startGame(level) {
    this.gems = 0; this.loadLevel(level || 0); this.setState('play');
  },

  setState(s) {
    this.state = s;
    hud.overlay.classList.toggle('hidden', s === 'play');
    if (s === 'menu') hud.card.innerHTML = MENU_HTML;
    if (s === 'pause') hud.card.innerHTML = `<h1>הפסקה</h1><h2>המקדש מחכה לכם...</h2><div class="start">לחצו P או Esc כדי להמשיך</div><div class="levels">לחצו M לחזרה לתפריט</div>`;
    if (s === 'over') hud.card.innerHTML = `<h1>אוי לא!</h1><h2>שני השחקנים נפלו בג'ונגל</h2><div class="tips">יהלומים שנאספו: 💎 ${this.gems}</div><div class="start">לחצו רווח או Enter כדי לנסות שוב מנקודת השמירה</div><div class="levels">לחצו M לחזרה לתפריט</div>`;
    if (s === 'win') hud.card.innerHTML = `<h1>ניצחון! <span class="gem">💎</span></h1><h2>עברתם את כל 10 השלבים, הבסתם את מלך היהלומים והצלתם את המקדש!</h2><div class="tips" style="font-size:22px">סך הכל יהלומים: 💎 ${this.gems}</div><div class="start">לחצו רווח או Enter כדי לשחק שוב</div>`;
  },

  retry() {
    // continue from the last checkpoint with full hearts
    for (const [k, p] of this.players.entries()) { p.dead = false; p.hearts = p.maxHearts; p.group.visible = p.shadow.visible = true; p.spawnAt(this.cpPos(k)); p.inv = 2; }
    if (this.arena.active && this.boss && !this.arena.done) this.spawnBoss();
    this.setState('play'); this.updateHud(true);
  },

  spawnBoss() {
    if (this.boss) this.disposeBoss();
    this.waves.forEach(w => w.dispose()); this.shards.forEach(s => s.dispose()); this.waves = []; this.shards = [];
    const cfg = typeof this.arena.boss === 'string' ? { type: this.arena.boss } : this.arena.boss;
    this.boss = new BOSSES[cfg.type](this.arena.c, cfg);
    hud.bossbar.style.display = 'block'; hud.bossname.textContent = this.boss.name; this.updateBossBar();
  },
  disposeBoss() {
    const rm = o => o && o.parent && o.parent.remove(o);
    const clean = b => {
      rm(b.g); rm(b.marker); rm(b.head); rm(b.hole); rm(b.beam);
      if (b.segs) b.segs.forEach(rm);
      if (b.beams) b.beams.forEach(x => rm(x.g));
      if (b.minions) b.minions.forEach(m => rm(m.g));
      if (b.parts) b.parts.forEach(clean);
    };
    if (this.boss) clean(this.boss);
    this.boss = null;
  },
  updateBossBar() { if (this.boss) hud.bossfill.style.width = `${100 * Math.max(0, this.boss.hp) / this.boss.maxHp}%`; },

  groundBelow(p) {
    let best = null;
    for (const c of this.plats) {
      if (!c.active || p.x < c.min.x || p.x > c.max.x || p.z < c.min.z || p.z > c.max.z) continue;
      if (c.max.y <= p.y + .05 && (best === null || c.max.y > best)) best = c.max.y;
    }
    return best;
  },
  solidAt(p) {
    for (const c of this.plats) if (c.active && p.x > c.min.x && p.x < c.max.x && p.y > c.min.y && p.y < c.max.y && p.z > c.min.z && p.z < c.max.z) return true;
    return false;
  },

  playerAttack(pl) {
    const reach = new V3(pl.pos.x + Math.sin(pl.face) * 1.1, pl.pos.y + 1, pl.pos.z + Math.cos(pl.face) * 1.1);
    const b = this.boss;
    if (b && !b.dead && b.state !== 'dying' && b.state !== 'wake') {
      const spheres = b.hitSpheres().map(s => Object.assign(s, { vuln: s.vuln !== undefined ? s.vuln : b.vulnerable })).sort((a, c) => c.vuln - a.vuln);
      for (const s of spheres) {
        if (s.p.distanceTo(reach) < s.r + 1) {
          if (s.vuln && (b.hitCd || 0) > 0) { burst(reach, 0x9ff4ff, 3, 4); }
          else if (s.vuln) {
            b.hp--; b.hitCd = .45; SFX.hit(); burst(reach, 0x9ff4ff, 12, 8); this.shake = Math.max(this.shake, .15); this.updateBossBar();
            if (b.hp <= 0) this.bossDefeated();
          } else {
            SFX.clink(); burst(reach, 0xffffaa, 5, 5);
            if (!this.hintClink) { this.hintClink = true; say('האבן קשה מדי! חכו שעיני היהלום יזהרו בכחול', 2.5); }
          }
          break;
        }
      }
      if (b.minions) for (const m of b.minions) {
        if (m.hp <= 0) continue;
        if (new V3(m.g.position.x, m.y + .6, m.g.position.z).distanceTo(reach) < 1.5) {
          m.hp--; m.stun = .5; SFX.hit(); burst(reach, 0xffaa66, 8);
          m.kb.set(Math.sin(pl.face) * 8, 0, Math.cos(pl.face) * 8);
          if (m.hp <= 0) { burst(m.g.position.clone().setY(m.y + .5), 0x9a9f88, 16, 7); levelGroup.remove(m.g); }
        }
      }
    }
  },

  bossDefeated() {
    const b = this.boss; b.kill(); SFX.win(); this.shake = .6;
    say(`${b.name} הובס!`, 3); hud.bossfill.style.width = '0%';
  },

  spawnPortal() {
    const c = this.arena.c;
    const g = new THREE.Group(); g.position.set(c.x, c.y + 2.2, c.z - 2); levelGroup.add(g);
    mk(GEO.torus, M.gold, 1, 1, 1, 0, 0, 0, g);
    const inner = mk(GEO.circle, M.portal, 1.55, 1.55, 1, 0, 0, 0, g);
    const gl = new THREE.Sprite(cyanGlow); gl.scale.setScalar(6); g.add(gl);
    this.portal = { g, inner };
    say(this.level < LEVELS.length - 1 ? 'שער היהלום נפתח — היכנסו אליו!' : 'השער האחרון נפתח — היכנסו!', 3);
    hud.bossbar.style.display = 'none';
  },

  updateHud(force) {
    for (const p of this.players) {
      const el = hud.p[p.idx];
      const key = `${p.hearts}|${p.dead}`;
      if (!force && el._k === key) continue; el._k = key;
      el.querySelector('.hearts').textContent = p.dead ? '💀' : '❤'.repeat(Math.max(0, p.hearts)) + '♡'.repeat(Math.max(0, p.maxHearts - p.hearts));
    }
    hud.gems.textContent = `💎 ${this.gems}`;
  },

  snapCams() { for (let i = 0; i < 2; i++) this.updateCam(i, 1, true); },
  updateCam(i, dt, snap) {
    const pl = this.players[i], other = this.players[1 - i];
    const focus = (pl.dead && other.alive ? other : pl).pos;
    const inArena = this.arena && this.arena.active;
    const off = inArena ? new V3(0, 8.5, 12.5) : new V3(0, 5.2, 8.6);
    const cam = cams[i];
    const want = focus.clone().add(off);
    if (snap) cam.position.copy(want); else cam.position.lerp(want, Math.min(1, dt * 6));
    cam._look = cam._look || new V3();
    const lookAt = focus.clone().add(new V3(0, 1.1, inArena ? -3 : -3.5));
    if (snap) cam._look.copy(lookAt); else cam._look.lerp(lookAt, Math.min(1, dt * 8));
    cam.lookAt(cam._look);
    if (this.shake > 0) { cam.position.x += (Math.random() - .5) * this.shake; cam.position.y += (Math.random() - .5) * this.shake; }
  },

  update(dt) {
    this.t += dt;
    for (const m of this.movers) m.tick(this.t, dt);
    for (const p of this.players) p.update(dt);
    for (const m of this.movers) { m.dx = m.dy = m.dz = 0; }
    // hazards
    for (const h of this.hazards) {
      h.update(this.t);
      for (const p of this.players) if (p.alive && h.test(p)) p.hurt(h.src);
    }
    // gems
    for (const g of this.gemList) {
      if (g.taken) continue;
      g.m.rotation.y += dt * 2.5; g.m.position.y = g.y + Math.sin(this.t * 3 + g.m.position.z) * .15;
      for (const p of this.players) {
        if (p.alive && p.center().distanceTo(g.m.position) < 1.1) {
          g.taken = true; g.m.visible = false; this.gems++; this.levelGems++; SFX.gem(); burst(g.m.position, 0x9ff4ff, 8, 4);
          if (this.gems % 10 === 0) {
            for (const q of this.players) if (q.alive) q.hearts = Math.min(q.maxHearts, q.hearts + 1);
            say('10 יהלומים! +❤ לשני השחקנים', 2);
          }
          break;
        }
      }
    }
    // checkpoints
    for (const c of this.cps) {
      c.gem.rotation.y += dt * 2;
      if (c.on) continue;
      for (const p of this.players) if (p.alive && Math.abs(p.pos.z - c.pos.z) < 1.6 && Math.abs(p.pos.y - c.pos.y) < 2 && Math.abs(p.pos.x - c.pos.x) < 4) {
        c.on = true; c.gem.material = M.cpOn; c.glow.material = goldGlow; this.cp.copy(c.pos); SFX.cp(); say('נקודת שמירה!', 1.4);
        // revive a fallen partner right away at the checkpoint
        for (const q of this.players) if (q.dead) q.respawn = Math.min(q.respawn, .5);
        break;
      }
    }
    // arena & boss
    const A = this.arena;
    if (A && !A.active) {
      const alive = this.players.filter(p => p.alive);
      if (alive.length && alive.every(p => p.pos.z < A.entryZ && p.pos.y > A.c.y - 1)) {
        A.active = true; A.gate.active = true; A.gate.mesh.visible = true; this.cp.copy(A.cpPos);
        for (const p of this.players) if (p.dead) p.respawn = Math.min(p.respawn, 1.5);
        this.spawnBoss(); SFX.slam(); this.shake = .5;
        banner(`בוס: ${this.boss.name}`, 2.5);
      }
    }
    if (this.boss) {
      this.boss.hitCd = (this.boss.hitCd || 0) - dt;
      this.boss.update(dt);
      if (this.boss.dead) { A.done = true; this.disposeBoss(); this.spawnPortal(); }
    }
    if (this.portal) {
      this.portal.g.rotation.y += dt * .8; this.portal.inner.material.opacity = .45 + Math.sin(this.t * 4) * .15;
      for (const p of this.players) if (p.alive && p.center().distanceTo(this.portal.g.position) < 2.2) { this.nextLevel(); return; }
    }
    this.waves = this.waves.filter(w => w.update(dt) || (w.dispose(), false));
    this.shards = this.shards.filter(s => s.update(dt) || (s.dispose(), false));
    updateParticles(dt);
    if (this.fireflies) { this.fireflies.material.opacity = .6 + Math.sin(this.t * 2) * .3; this.fireflies.position.y = Math.sin(this.t * .5) * .6; }
    // statues' eyes twinkle
    diamondMat.emissive.setHSL(.53, .7, .38 + Math.sin(this.t * 3) * .08);
    if (this.players.every(p => p.dead)) { this.setState('over'); }
    this.shake = Math.max(0, this.shake - dt * 1.5);
    this.updateHud();
  },

  nextLevel() {
    SFX.win();
    if (this.level < LEVELS.length - 1) this.loadLevel(this.level + 1);
    else this.setState('win');
  },
};

const MENU_HTML = `
  <h1>מקדש <span class="gem">היהלומים</span></h1>
  <h2>הרפתקת פארקור ובוסים לשני שחקנים בג'ונגל של פסלי האבן</h2>
  <div class="controls">
    <div class="ctl p1"><h3>שחקן 1 — אדום (מסך שמאל)</h3>
      <div>תנועה: <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></div>
      <div>קפיצה (וקפיצה כפולה): <kbd>רווח</kbd></div>
      <div>התקפה בחרב: <kbd>F</kbd></div></div>
    <div class="ctl p2"><h3>שחקן 2 — כחול (מסך ימין)</h3>
      <div>תנועה: <kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd></div>
      <div>קפיצה (וקפיצה כפולה): <kbd>Enter</kbd></div>
      <div>התקפה בחרב: <kbd>\</kbd> (מעל ה־Enter), <kbd>Shift ימני</kbd> או <kbd>L</kbd></div></div>
  </div>
  <div class="tips">אספו יהלומים 💎 (כל 10 = לב לשניכם) • געו בלוחות האבן כדי לשמור • הבוסים עשויים אבן —<br>
  תקפו אותם רק כשעיני היהלום שלהם זוהרות בכחול • אם אחד נופל, השני ממשיך והוא יחזור אחרי כמה שניות</div>
  <div class="start">לחצו רווח או Enter כדי להתחיל</div>
  <div class="levels">בחירת שלב (10 שלבים): <kbd>1</kbd>–<kbd>9</kbd>, ו־<kbd>0</kbd> לשלב 10 &nbsp;•&nbsp; הפסקה: <kbd>P</kbd></div>`;

// ---------------------------------------------------------------- boot & main loop
G.players = [new Player(0), new Player(1)];
G.loadLevel(0);
G.setState('menu');
hud.banner.style.opacity = 0; bannerTimer = 0;
window.G = G;

function handleMeta() {
  const start = pressed.has('Space') || pressed.has('Enter') || pressed.has('NumpadEnter');
  if (G.state === 'menu') {
    for (let i = 0; i < LEVELS.length; i++) if (pressed.has(`Digit${(i + 1) % 10}`)) { G.startGame(i); return true; }
    if (start) { G.startGame(0); return true; }
  } else if (G.state === 'play') {
    if (pressed.has('KeyP') || pressed.has('Escape')) { G.setState('pause'); return true; }
    if (pressed.has('Backquote') && G.arena && !G.arena.active) {   // debug: jump to the boss arena
      G.players.forEach((p, k) => p.spawnAt(G.arena.cpPos.clone().add(new V3(k ? 1 : -1, .2, -2))));
      return true;
    }
  } else if (G.state === 'pause') {
    if (pressed.has('KeyP') || pressed.has('Escape')) { G.setState('play'); return true; }
    if (pressed.has('KeyM')) { G.loadLevel(0); G.setState('menu'); hud.banner.style.opacity = 0; return true; }
  } else if (G.state === 'over') {
    if (start) { G.retry(); return true; }
    if (pressed.has('KeyM')) { G.loadLevel(0); G.setState('menu'); hud.banner.style.opacity = 0; return true; }
  } else if (G.state === 'win') {
    if (start) { G.loadLevel(0); G.setState('menu'); hud.banner.style.opacity = 0; return true; }
  }
  return false;
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (!handleMeta()) {
    if (G.state === 'play') G.update(dt);
    else if (G.state === 'menu') { G.t += dt; for (const m of G.movers) m.tick(G.t, dt); for (const m of G.movers) m.dx = m.dy = m.dz = 0; }
  }
  pressed.clear();
  if (msgTimer > 0) { msgTimer -= dt; if (msgTimer <= 0) hud.msg.style.opacity = 0; }
  if (bannerTimer > 0) { bannerTimer -= dt; if (bannerTimer <= 0) hud.banner.style.opacity = 0; }
  for (const p of G.players) {
    const note = hud.p[p.idx].querySelector('.note');
    const txt = p.dead ? (G.players[1 - p.idx].alive ? `חוזר בעוד ${Math.max(0, Math.ceil(p.respawn))}...` : '') : '';
    if (note.textContent !== txt) note.textContent = txt;
  }
  // render split screen: player 1 on the left, player 2 on the right
  const w = innerWidth, h = innerHeight, half = Math.floor(w / 2);
  renderer.setScissorTest(true);
  for (let i = 0; i < 2; i++) {
    if (G.state === 'menu') {
      const a = G.t * .15 + i * Math.PI;
      cams[i].position.set(Math.sin(a) * 14, 9, -14 + Math.cos(a) * 14); cams[i].lookAt(0, 1, -14);
    } else G.updateCam(i, dt);
    const x = i * half, vw = i ? w - half : half;
    renderer.setViewport(x, 0, vw, h); renderer.setScissor(x, 0, vw, h);
    cams[i].aspect = vw / h; cams[i].updateProjectionMatrix();
    renderer.render(scene, cams[i]);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
